name: Persistence and editor regression tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'feature/subjects/**'
      - 'feature/calendar/**'
      - 'feature/settings/**'
      - 'core/data/**'
      - 'core/model/**'
      - 'core/database/**'
      - 'core/ui/**'
      - 'app/src/androidTest/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/draft-restoration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'feature/subjects/**'
      - 'feature/calendar/**'
      - 'feature/settings/**'
      - 'core/data/**'
      - 'core/model/**'
      - 'core/database/**'
      - 'core/ui/**'
      - 'app/src/androidTest/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/draft-restoration.yml'

concurrency:
  group: draft-restoration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free space for the emulator
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run draft, editor, migration and restore regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 180
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kpyruy.takt.app.DraftRestorationTest,com.kpyruy.takt.app.EditorRecoveryUiTest,com.kpyruy.takt.app.DataIntegrityTest,com.kpyruy.takt.app.AssessmentStatePersistenceTest,com.kpyruy.takt.app.LessonConversionAtomicTest,com.kpyruy.takt.app.BackupAtomicRestoreTest,com.kpyruy.takt.app.DocumentFailureRecoveryTest,com.kpyruy.takt.app.UisAccountLifecycleTest -Pandroid.testInstrumentationRunnerArguments.draftReview=true -Pandroid.testInstrumentationRunnerArguments.liquidGlassReview=true --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-restoration-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
