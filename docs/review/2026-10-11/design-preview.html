<!doctype html><html lang="uk"><meta charset="UTF-8"><title>Takt — пропозиція дизайну</title><style>

*{box-sizing:border-box}body{margin:0;font-family:Inter, sans-serif;background:#F6F8FC;color:#1B283D;font-size:14px;line-height:1.45;--primary:#345DD2;--muted:#58677C;--surface:#fff;--line:#E5EAF2;--tint:#EAF0FF}body.warm{--primary:#AE4724;--tint:#FBEDE7}body.dark{background:#131C29;color:#EDF3FF;--primary:#AAC1FF;--muted:#AFBBCD;--surface:#202C3C;--line:#364257;--tint:#2B3E62}.status{height:48px;display:flex;justify-content:space-between;padding:16px 20px;font-size:12px;font-weight:600}main{padding:8px 20px 28px}.nav{height:48px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.nav span:first-child{font-size:24px;color:inherit}.nav span:last-child{font-size:24px}.title{font-size:29px;line-height:34px;font-weight:600;letter-spacing:-.7px;margin:16px 0 24px}.panel{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;margin-bottom:14px}.date{background:var(--tint);border:none;display:flex;align-items:center;gap:16px}.day{font-size:29px;font-weight:600;line-height:34px}.meta{font-size:13px;color:var(--muted);line-height:19px}.date-num{border-right:1px solid var(--line);padding-right:16px}.time{font-size:16px;font-weight:600}.admission{background:#FFF2DF;color:#80501C;border-color:#F0DBC1;display:flex;align-items:center;gap:14px}.dark .admission{background:#463A2A;color:#EFC78F;border-color:#685132}.admission strong{font-size:23px}.admission .meta{color:inherit}.label{font-size:15px;font-weight:600}.target-head{display:flex;justify-content:space-between;align-items:center}.tag{border-radius:7px;background:var(--tint);color:var(--primary);padding:5px 8px;font-size:13px}.score{font-size:42px;font-weight:600;line-height:52px;margin-top:12px}.score .total{font-size:20px;font-weight:400;color:var(--muted)}.grade-options{display:flex;gap:7px;margin:18px 0 0}.grade-options span{height:48px;flex:1;text-align:center;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);font-size:14px}.grade-options span:first-child{background:var(--primary);color:white}.dark .grade-options span:first-child{color:#172B56}.disclosure{padding:16px;display:flex;justify-content:space-between;font-size:15px;font-weight:600}.formula{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.detail-number{display:flex;justify-content:space-between;padding:5px 0}.callout{margin-top:12px;font-size:13px;line-height:20px;color:var(--muted)}.subject-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px}.subject-head .title{margin:0 0 5px}.avatar{font-size:26px;font-weight:600;background:var(--tint);color:var(--primary);height:48px;width:48px;border-radius:12px;display:grid;place-items:center}.tabs{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 22px;border-bottom:1px solid var(--line);color:var(--muted)}.tabs span{padding:10px 0}.tabs .active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:600}.admission-progress{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;font-weight:600}.progress{height:7px;border-radius:6px;background:var(--tint);overflow:hidden}.progress div{width:50%;height:100%;background:var(--primary)}.work{padding:14px 16px}.work-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.work-title{font-weight:600;font-size:15px;line-height:21px}.dots{color:var(--muted);font-size:24px;line-height:22px}.work-bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}.result{font-weight:600;font-size:15px;white-space:nowrap}.urgent{color:#A13430;font-weight:600}.dark .urgent{color:#FFB4AB}.subdetails{font-size:13px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between}.work-type{font-size:13px;color:var(--muted);margin:4px 0 0}.button{border:1px solid var(--line);border-radius: </style><body><div class="status"><span>10:10</span><span>▰ ▰ ▰</span></div><main id="content"></main><div class="bottom"><span></span></div><script>
const p=new URLSearchParams(location.search), type=p.get('type')||'exam';document.body.className=p.get('theme')||'';
const nav=label=>`<div class="nav"><span>‹</span><span>${label}</span><span>⋯</span></div>`;
const date=`<div class="panel date"><div class="date-num"><div class="day">18</div><div class="meta">груд. 2026</div></div><div><div class="time">09:00 · B-214</div><div class="meta">Підсумковий екзамен · спроба 1/3</div></div></div>`;
const admission=`<div class="panel admission"><strong>1/2</strong><div style="flex:1"><div class="label">Ще одна робота до допуску</div><div class="meta">Здати протокол експерименту</div></div><span>›</span></div>`;
const detail=`<div class="detail-number"><span>За семестр</span><b>34 / 50 б.</b></div><div class="detail-number"><span>Ще доступно за інші роботи</span><b>10 б.</b></div><div class="detail-number"><span>Доступно на екзамені</span><b>50 б.</b></div><div class="detail-number"><span>Поріг A</span><b>92 / 100 б.</b></div><div class="formula">34 набрано + 10 за інші роботи + 48 на екзамені = 92</div><div class="callout">Ціль можлива, якщо виконати всі незавершені роботи. Досяжний максимум — 94 / 100 б.</div>`;
if(type.startsWith('exam')){document.getElementById('content').innerHTML=nav('Фізика')+`<div class="title">Екзамен</div>`+date+admission+`<div class="panel"><div class="target-head"><div class="label">Потрібно на екзамені</div><span class="tag">A · від 92%</span></div>${type==='exam-impossible'?`<div class="unreachable">A поки недосяжна</div><div class="meta">Досяжний максимум — 84 / 100 б.; для A потрібно 92.</div>`:`<div class="score">48 <span class="total">/ 50 б.</span></div><div class="meta">Якщо заробиш ще 10 б. за інші роботи</div>`}<div class="grade-options"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span></div></div><div class="panel"><div style="display:flex;justify-content:space-between" class="label">Як досягти оцінки <span>${type==='exam-expanded'?'⌃':'⌄'}</span></div>${type==='exam-expanded'?`<div style="margin-top:14px">${detail}</div>`:''}</div>`;
}else{document.getElementById('content').innerHTML=nav('Предмет')+`<div class="subject-head"><div><div class="title">Фізика</div><div class="meta">FYZI_6B · 5 кредитів · 3 семестр</div></div><div class="avatar">Ф</div></div><div class="tabs"><span>Огляд</span><span class="active">Задачі</span><span>Екзамен</span><span>Нотатки</span></div><div class="panel"><div class="admission-progress"><span>Допуск до екзамену</span><span>1 / 2</span></div><div class="progress"><div></div></div></div><div class="panel work"><div class="work-head"><div><div class="work-title">Здати протокол експерименту</div><div class="work-type">Лабораторна · потрібна для допуску</div></div><span class="dots">⋮</span></div><div class="work-bottom"><span class="meta urgent">Прострочено · 10.10</span><span class="result">— / 10 б.</span></div><div class="subdetails"><span>Мінімум для допуску: 5 б.</span><span>›</span></div></div><div class="panel work"><div class="work-head"><div class="work-title" style="display:flex;gap:10px;align-items:flex-start"><span style="display:inline-block;width:20px;min-width:20px;height:20px;border:2px solid var(--muted);border-radius:3px;margin-top:1px"></span><span>Повторити формули хвиль</span></div><span class="dots">⋮</span></div><div class="work-bottom"><span class="meta">До 14.10</span><span class="result" style="font-size:13px;color:var(--muted)">Не виконано</span></div></div><div class="panel work"><div class="work-head"><div class="work-title">Підсумковий екзамен</div><span class="dots">⋮</span></div><div class="work-bottom"><span class="meta">18.12 · заплановано</span><span class="result">— / 50 б.</span></div></div><div class="panel work"><div class="work-head"><div><div class="work-title">Тест: механічні коливання</div><div class="work-type">Тест · для допуску</div></div><span class="dots">⋮</span></div><div class="work-bottom"><span class="meta">13.10 · результат записано</span><span class="result">14 / 20 б.</span></div><div class="subdetails"><span>45 хв · мінімум 10 б.</span><span>›</span></div></div><div class="panel work"><div class="work-head"><div class="work-title">Звіт про лабораторну роботу з вимірювання прискорення</div><span class="dots">⋮</span></div><div class="work-bottom"><span class="meta">09.10 · результат записано</span><span class="result">20 / 20 б.</span></div></div><div class="button">＋ Додати роботу</div>`;}
if(p.get('large')){document.querySelectorAll('.work-title').forEach(e=>e.style.fontSize='22px');document.querySelectorAll('.meta,.work-type,.subdetails').forEach(e=>e.style.fontSize='19px');document.querySelectorAll('.work-title,.meta,.work-type,.subdetails').forEach(e=>e.style.lineHeight='1.45');}
</script></html>
